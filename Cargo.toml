[package]
name = "goethite"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["netsalmon"]
readme = "README.md"

[dependencies]
fdt = "0.2.0-alpha2"

[target.'cfg(target_arch = "riscv64")'.dependencies]
goethite-macros = { path = "crates/macros" }
goethite-riscv64 = { path = "crates/riscv64" }
goethite-riscv64-asm = { path = "crates/riscv64-asm" }
goethite-sync = { path = "crates/sync" }
goethite-config = { path = "crates/config" }
goethite-id-alloc = { path = "crates/id-alloc" }
goethite-intrusive-list = { path = "crates/intrusive-list" }
goethite-console = { path = "crates/console" }
goethite-abi = { path = "crates/abi" }
goethite-fs = { path = "crates/fs" }
goethite-minix = { path = "crates/minix" }
goethite-elf = { path = "crates/elf" }
goethite-stack = { path = "crates/stack" }
paste = "1.0.15"
thiserror = { version = "2.0.20", default-features = false }

[[bin]]
name = "goethite"
path = "src/main.rs"
test = false
bench = false

[workspace]
members = [
    "crates/*",
    "userland"
]

[profile.dev]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
